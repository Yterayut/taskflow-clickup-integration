<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - Role-Based Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 0 20px 20px 0;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            position: relative;
            transition: all 0.3s ease;
        }

        .sidebar.collapsed {
            width: 80px;
        }

        .sidebar-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
        }

        .sidebar-header h2 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .user-info {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: center;
        }

        .user-role {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-item {
            margin-bottom: 5px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            color: #555;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-link:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: translateX(5px);
        }

        .nav-link.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .nav-link i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .content-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content-title {
            color: #333;
            font-size: 28px;
            font-weight: 600;
        }

        .breadcrumb {
            color: #666;
            font-size: 14px;
        }

        .content-body {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            min-height: 500px;
        }

        /* Component Styles */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s ease;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .card-title i {
            margin-right: 10px;
            font-size: 24px;
        }

        .card-value {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .card-subtitle {
            opacity: 0.9;
            font-size: 14px;
        }

        /* Loading States */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(102, 126, 234, 0.3);
            border-left: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                position: fixed;
                top: 0;
                left: -100%;
                height: 100vh;
                z-index: 1000;
                border-radius: 0;
            }

            .sidebar.open {
                left: 0;
            }

            .main-content {
                margin-left: 0;
                width: 100%;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Error States */
        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        /* Role-specific Styles */
        .role-manager .sidebar {
            border-left: 4px solid #4CAF50;
        }

        .role-team-lead .sidebar {
            border-left: 4px solid #FF9800;
        }

        .role-employee .sidebar {
            border-left: 4px solid #2196F3;
        }

        /* Component visibility */
        .component {
            display: none;
        }

        .component.active {
            display: block;
        }
    </style>
</head>
<body>
    <!-- Sidebar Navigation -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>TaskFlow Pro</h2>
        </div>
        
        <div class="user-info" id="userInfo">
            <div class="user-name">Loading...</div>
            <div class="user-role">Loading...</div>
        </div>
        
        <ul class="nav-menu" id="navMenu">
            <!-- Navigation items will be populated dynamically -->
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <header class="content-header">
            <div>
                <h1 class="content-title" id="contentTitle">Dashboard</h1>
                <div class="breadcrumb" id="breadcrumb">Home > Dashboard</div>
            </div>
        </header>

        <div class="content-body" id="contentBody">
            <!-- Components will be loaded here -->
            
            <!-- Dashboard Component -->
            <div id="dashboardComponent" class="component active">
                <div class="dashboard-grid" id="dashboardGrid">
                    <!-- Dashboard cards will be populated -->
                </div>
                <div id="dashboardContent">
                    <!-- Additional dashboard content -->
                </div>
            </div>

            <!-- My Tasks Component -->
            <div id="myTasksComponent" class="component">
                <h3>My Tasks</h3>
                <div id="tasksContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Team Overview Component -->
            <div id="teamOverviewComponent" class="component">
                <h3>Team Overview</h3>
                <div id="teamContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Team Analytics Component -->
            <div id="teamAnalyticsComponent" class="component">
                <h3>Team Analytics</h3>
                <div id="analyticsContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- Employee Management Component -->
            <div id="employeeManagementComponent" class="component">
                <h3>Employee Management</h3>
                <div id="employeeContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- My Profile Component -->
            <div id="myProfileComponent" class="component">
                <h3>My Profile</h3>
                <div id="profileContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- System Settings Component (Master/Manager only) -->
            <div id="systemSettingsComponent" class="component">
                <h3>System Settings</h3>
                <div id="settingsContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Token Management -->
    <script src="/js/token-manager.js"></script>
    
    <script>
        // Global application state
        const App = {
            currentUser: null,
            currentRole: null,
            capabilities: {},
            navigation: [],
            activeComponent: 'dashboardComponent',
            baseURL: 'http://192.168.20.10:7812',
            tokenManager: null
        };

        // Component icon mapping
        const COMPONENT_ICONS = {
            'Dashboard': 'fas fa-tachometer-alt',
            'All Tasks': 'fas fa-tasks',
            'My Tasks': 'fas fa-clipboard-list',
            'Team Overview': 'fas fa-users',
            'Team Analytics': 'fas fa-chart-bar',
            'Employee Management': 'fas fa-user-cog',
            'Team Ranking': 'fas fa-trophy',
            'Reports': 'fas fa-file-alt',
            'Team Attendance': 'fas fa-calendar-check',
            'System Settings': 'fas fa-cog',
            'My Team Dashboard': 'fas fa-users-cog',
            'My Team Members': 'fas fa-user-friends',
            'Team Tasks': 'fas fa-project-diagram',
            'My Dashboard': 'fas fa-user',
            'My Profile': 'fas fa-user-circle',
            'Knowledge Management': 'fas fa-book'
        };

        // Initialize application
        async function initializeApp() {
            try {
                showLoading(true);
                
                // Initialize token manager
                initializeTokenManager();
                
                // Check authentication
                const token = getAuthToken();
                if (!token) {
                    redirectToLogin();
                    return;
                }

                // Load user profile and dashboard configuration
                await loadUserProfile();
                await loadDashboardConfig();
                
                // Setup navigation
                setupNavigation();
                
                // Load default component
                await switchComponent(App.activeComponent);
                
                showLoading(false);
                
            } catch (error) {
                console.error('App initialization failed:', error);
                showError('Failed to initialize application');
                showLoading(false);
            }
        }
        
        // Initialize token manager
        function initializeTokenManager() {
            if (typeof TokenManager !== 'undefined') {
                App.tokenManager = new TokenManager({
                    baseURL: App.baseURL,
                    onTokenRefreshed: (info) => {
                        console.log('✅ Token refreshed:', info);
                        if (info.user) {
                            App.currentUser = info.user;
                            App.capabilities = info.capabilities;
                            updateUserInfo();
                        }
                        showNotification('Token refreshed successfully', 'success');
                    },
                    onTokenExpired: () => {
                        console.log('🔴 Token expired - redirecting to login');
                        showNotification('Session expired. Please login again.', 'error');
                        setTimeout(() => {
                            redirectToLogin();
                        }, 2000);
                    },
                    onRefreshFailed: (error) => {
                        console.error('❌ Token refresh failed:', error);
                        showNotification('Session refresh failed. Please login again.', 'error');
                        setTimeout(() => {
                            redirectToLogin();
                        }, 3000);
                    },
                    onStatusChanged: (status) => {
                        console.log('🔄 Token status changed:', status);
                        updateTokenStatus(status);
                    }
                });
                
                console.log('✅ Token manager initialized');
            } else {
                console.warn('⚠️ TokenManager not available');
            }
        }"}

        // Load user profile
        async function loadUserProfile() {
            try {
                const response = await fetchAPI('/api/v2/auth/profile');
                if (response.success) {
                    App.currentUser = response.data.user;
                    App.capabilities = response.data.capabilities;
                    App.navigation = response.data.navigation;
                    
                    updateUserInfo();
                    updateBodyClass();
                }
            } catch (error) {
                console.error('Failed to load user profile:', error);
                throw error;
            }
        }

        // Load dashboard configuration
        async function loadDashboardConfig() {
            try {
                const response = await fetchAPI('/api/v2/dashboard/config');
                if (response.success) {
                    App.currentRole = response.data.role;
                    App.activeComponent = getComponentId(response.data.defaultComponent);
                }
            } catch (error) {
                console.error('Failed to load dashboard config:', error);
                // Continue with defaults
            }
        }

        // Setup navigation menu
        function setupNavigation() {
            const navMenu = document.getElementById('navMenu');
            navMenu.innerHTML = '';

            App.navigation.forEach(item => {
                const li = document.createElement('li');
                li.className = 'nav-item';
                
                const componentId = getComponentId(item);
                const icon = COMPONENT_ICONS[item] || 'fas fa-circle';
                
                li.innerHTML = `
                    <a href="#" class="nav-link" data-component="${componentId}">
                        <i class="${icon}"></i>
                        <span>${item}</span>
                    </a>
                `;
                
                navMenu.appendChild(li);
            });

            // Add event listeners
            navMenu.addEventListener('click', handleNavigation);
        }

        // Handle navigation clicks
        function handleNavigation(event) {
            event.preventDefault();
            
            const link = event.target.closest('.nav-link');
            if (!link) return;
            
            const componentId = link.dataset.component;
            if (componentId) {
                switchComponent(componentId);
                
                // Update active state
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                link.classList.add('active');
            }
        }

        // Switch active component
        async function switchComponent(componentId) {
            try {
                showLoading(true);
                
                // Hide all components
                document.querySelectorAll('.component').forEach(c => c.classList.remove('active'));
                
                // Show target component
                const component = document.getElementById(componentId);
                if (component) {
                    component.classList.add('active');
                    App.activeComponent = componentId;
                    
                    // Update content title
                    updateContentTitle(componentId);
                    
                    // Load component data
                    await loadComponentData(componentId);
                }
                
                showLoading(false);
                
            } catch (error) {
                console.error('Failed to switch component:', error);
                showError('Failed to load component');
                showLoading(false);
            }
        }

        // Load component-specific data
        async function loadComponentData(componentId) {
            switch (componentId) {
                case 'dashboardComponent':
                    await loadDashboardData();
                    break;
                case 'myTasksComponent':
                case 'allTasksComponent':
                case 'teamTasksComponent':
                    await loadTasksData();
                    break;
                case 'teamOverviewComponent':
                case 'myTeamMembersComponent':
                case 'employeeManagementComponent':
                    await loadTeamData();
                    break;
                case 'teamAnalyticsComponent':
                    await loadAnalyticsData();
                    break;
                case 'myProfileComponent':
                    await loadProfileData();
                    break;
                // Add more cases as needed
            }
        }

        // Load dashboard data
        async function loadDashboardData() {
            try {
                const [tasksResponse, analyticsResponse] = await Promise.all([
                    fetchAPI('/api/v2/dashboard/tasks'),
                    fetchAPI('/api/v2/dashboard/analytics')
                ]);

                const dashboardGrid = document.getElementById('dashboardGrid');
                dashboardGrid.innerHTML = '';

                // Create dashboard cards based on role
                if (App.capabilities.canViewAllTasks) {
                    createDashboardCard('Total Tasks', tasksResponse.data?.count || 0, 'fas fa-tasks', '#667eea');
                }
                
                if (analyticsResponse.success) {
                    const analytics = analyticsResponse.data;
                    createDashboardCard('Completed', analytics.completed || 0, 'fas fa-check-circle', '#4CAF50');
                    createDashboardCard('In Progress', analytics.inProgress || 0, 'fas fa-clock', '#FF9800');
                    createDashboardCard('Overdue', analytics.overdue || 0, 'fas fa-exclamation-triangle', '#f44336');
                }

            } catch (error) {
                console.error('Failed to load dashboard data:', error);
                showError('Failed to load dashboard data');
            }
        }

        // Load tasks data
        async function loadTasksData() {
            try {
                const response = await fetchAPI('/api/v2/dashboard/tasks');
                if (response.success) {
                    const tasksContainer = document.getElementById('tasksContainer');
                    tasksContainer.innerHTML = renderTasksList(response.data.tasks);
                }
            } catch (error) {
                console.error('Failed to load tasks:', error);
                showError('Failed to load tasks');
            }
        }

        // Load team data
        async function loadTeamData() {
            try {
                const response = await fetchAPI('/api/v2/dashboard/team-members');
                if (response.success) {
                    const teamContainer = document.getElementById('teamContainer') || 
                                        document.getElementById('employeeContainer');
                    if (teamContainer) {
                        teamContainer.innerHTML = renderTeamList(response.data.teamMembers);
                    }
                }
            } catch (error) {
                console.error('Failed to load team data:', error);
                showError('Failed to load team data');
            }
        }

        // Load analytics data
        async function loadAnalyticsData() {
            try {
                const response = await fetchAPI('/api/v2/dashboard/analytics');
                if (response.success) {
                    const analyticsContainer = document.getElementById('analyticsContainer');
                    analyticsContainer.innerHTML = renderAnalytics(response.data);
                }
            } catch (error) {
                console.error('Failed to load analytics:', error);
                showError('Failed to load analytics');
            }
        }

        // Load profile data
        async function loadProfileData() {
            try {
                const profileContainer = document.getElementById('profileContainer');
                profileContainer.innerHTML = renderProfile(App.currentUser);
            } catch (error) {
                console.error('Failed to load profile:', error);
                showError('Failed to load profile');
            }
        }

        // Render functions
        function createDashboardCard(title, value, icon, color) {
            const dashboardGrid = document.getElementById('dashboardGrid');
            const card = document.createElement('div');
            card.className = 'dashboard-card';
            card.style.background = `linear-gradient(135deg, ${color}, ${color}dd)`;
            
            card.innerHTML = `
                <div class="card-title">
                    <i class="${icon}"></i>
                    ${title}
                </div>
                <div class="card-value">${value}</div>
                <div class="card-subtitle">Total ${title.toLowerCase()}</div>
            `;
            
            dashboardGrid.appendChild(card);
        }

        function renderTasksList(tasks) {
            if (!tasks || tasks.length === 0) {
                return '<p>No tasks found.</p>';
            }
            
            return `
                <div class="tasks-list">
                    ${tasks.map(task => `
                        <div class="task-item">
                            <h4>${task.name}</h4>
                            <p>Status: ${task.status}</p>
                            <p>Due: ${task.due_date ? new Date(task.due_date).toLocaleDateString() : 'No due date'}</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderTeamList(teamMembers) {
            if (!teamMembers || teamMembers.length === 0) {
                return '<p>No team members found.</p>';
            }
            
            return `
                <div class="team-list">
                    ${teamMembers.map(member => `
                        <div class="team-member">
                            <h4>${member.fullName || member.email}</h4>
                            <p>Role: ${member.role}</p>
                            <p>Email: ${member.email}</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderAnalytics(analytics) {
            return `
                <div class="analytics-grid">
                    <div class="analytics-chart">
                        <h4>Performance Overview</h4>
                        <p>Completed: ${analytics.completed || 0}</p>
                        <p>In Progress: ${analytics.inProgress || 0}</p>
                        <p>Overdue: ${analytics.overdue || 0}</p>
                    </div>
                </div>
            `;
        }

        function renderProfile(user) {
            return `
                <div class="profile-info">
                    <h4>User Information</h4>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>Role:</strong> ${user.role}</p>
                    <p><strong>Last Login:</strong> ${user.lastLogin ? new Date(user.lastLogin).toLocaleString() : 'Never'}</p>
                </div>
            `;
        }

        // Utility functions
        function getComponentId(componentName) {
            return componentName.toLowerCase()
                .replace(/\s+/g, '')
                .replace('my', 'my')
                .replace('all', 'all')
                .replace('team', 'team') + 'Component';
        }

        function updateUserInfo() {
            const userInfo = document.getElementById('userInfo');
            if (App.currentUser) {
                userInfo.innerHTML = `
                    <div class="user-name">${App.currentUser.fullName || App.currentUser.email}</div>
                    <div class="user-role">${App.currentUser.role}</div>
                `;
            }
        }

        function updateBodyClass() {
            document.body.className = `role-${App.currentUser.role}`;
        }

        function updateContentTitle(componentId) {
            const titleElement = document.getElementById('contentTitle');
            const breadcrumbElement = document.getElementById('breadcrumb');
            
            const titles = {
                'dashboardComponent': 'Dashboard',
                'myTasksComponent': 'My Tasks',
                'allTasksComponent': 'All Tasks',
                'teamOverviewComponent': 'Team Overview',
                'teamAnalyticsComponent': 'Team Analytics',
                'employeeManagementComponent': 'Employee Management',
                'myProfileComponent': 'My Profile',
                'systemSettingsComponent': 'System Settings'
            };
            
            const title = titles[componentId] || 'Dashboard';
            titleElement.textContent = title;
            breadcrumbElement.textContent = `Home > ${title}`;
        }

        function showLoading(show) {
            // Implementation depends on your loading UI
        }

        function showError(message) {
            const contentBody = document.getElementById('contentBody');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            contentBody.insertBefore(errorDiv, contentBody.firstChild);
            
            // Remove error after 5 seconds
            setTimeout(() => {
                if (errorDiv.parentNode) {
                    errorDiv.parentNode.removeChild(errorDiv);
                }
            }, 5000);
        }
        
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification notification-${type}`;
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: ${type === 'success' ? '#4CAF50' : type === 'error' ? '#f44336' : '#2196F3'};
                color: white;
                padding: 15px 20px;
                border-radius: 10px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.2);
                z-index: 9999;
                max-width: 300px;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 300);
            }, 4000);
        }
        
        function updateTokenStatus(status) {
            // Update UI indicators based on token status
            const statusIndicator = document.querySelector('.token-status') || createTokenStatusIndicator();
            
            switch (status.status) {
                case 'valid':
                    statusIndicator.style.background = '#4CAF50';
                    statusIndicator.title = `Token valid - expires in ${status.timeUntilExpiry} minutes`;
                    break;
                case 'expires_soon':
                    statusIndicator.style.background = '#FF9800';
                    statusIndicator.title = 'Token expires soon - will refresh automatically';
                    break;
                case 'grace_period':
                    statusIndicator.style.background = '#FF5722';
                    statusIndicator.title = 'Token expired - attempting refresh';
                    break;
                case 'expired':
                    statusIndicator.style.background = '#f44336';
                    statusIndicator.title = 'Session expired';
                    break;
                case 'refreshed':
                    statusIndicator.style.background = '#4CAF50';
                    statusIndicator.title = 'Token refreshed successfully';
                    break;
            }
        }
        
        function createTokenStatusIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'token-status';
            indicator.style.cssText = `
                position: fixed;
                top: 10px;
                right: 10px;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #4CAF50;
                z-index: 10000;
                cursor: help;
            `;
            document.body.appendChild(indicator);
            return indicator;
        }"}

        function getAuthToken() {
            // Get token from cookie or localStorage
            return document.cookie.split(';').find(cookie => cookie.trim().startsWith('taskflow_token='))?.split('=')[1];
        }

        function redirectToLogin() {
            window.location.href = '/login-v2.html';
        }

        async function fetchAPI(endpoint, options = {}) {
            const token = getAuthToken();
            const response = await fetch(App.baseURL + endpoint, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                },
                credentials: 'include'
            });

            if (!response.ok) {
                if (response.status === 401) {
                    redirectToLogin();
                    return;
                }
                throw new Error(`API request failed: ${response.statusText}`);
            }

            return response.json();
        }

        // Initialize app when DOM is loaded
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
