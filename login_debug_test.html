<!DOCTYPE html>
<html>
<head>
    <title>Login Debug Test</title>
</head>
<body>
    <h1>TaskFlow Login Debug Test</h1>
    <div id="status">Testing...</div>
    <div id="details"></div>
    
    <script>
        async function testLoginFlow() {
            const status = document.getElementById('status');
            const details = document.getElementById('details');
            
            try {
                // Step 1: Login
                status.innerHTML = '🔄 Step 1: Attempting login...';
                
                const loginResponse = await fetch('http://192.168.20.10:7812/api/v2/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: 'yterayut@gmail.com',
                        password: 'test'
                    })
                });
                
                const loginData = await loginResponse.json();
                details.innerHTML += '<p>✅ Login Response: ' + JSON.stringify(loginData, null, 2) + '</p>';
                
                if (!loginData.success) {
                    throw new Error('Login failed');
                }
                
                // Step 2: Verify session
                status.innerHTML = '🔄 Step 2: Verifying session...';
                
                const verifyResponse = await fetch('http://192.168.20.10:7812/api/v2/auth/verify', {
                    method: 'GET',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const verifyData = await verifyResponse.json();
                details.innerHTML += '<p>✅ Verify Response: ' + JSON.stringify(verifyData, null, 2) + '</p>';
                
                if (verifyData.success && verifyData.user) {
                    // Step 3: Test data structure access
                    status.innerHTML = '🔄 Step 3: Testing data structure...';
                    
                    details.innerHTML += '<p>🔍 User Role Test:</p>';
                    details.innerHTML += '<p>• data.user.role = "' + verifyData.user.role + '"</p>';
                    details.innerHTML += '<p>• data.user.name = "' + verifyData.user.name + '"</p>';
                    details.innerHTML += '<p>• data.user.email = "' + verifyData.user.email + '"</p>';
                    
                    // Test role mapping
                    const roleMapping = {
                        'master': 'Manager',
                        'manager': 'Manager', 
                        'team_lead': 'Team Lead',
                        'employee': 'Employee',
                        'user': 'User'
                    };
                    
                    const mappedRole = roleMapping[verifyData.user.role] || 'User';
                    details.innerHTML += '<p>• Mapped Role = "' + mappedRole + '"</p>';
                    
                    status.innerHTML = '✅ SUCCESS: Authentication flow works!';
                    
                } else {
                    throw new Error('Session verification failed');
                }
                
            } catch (error) {
                status.innerHTML = '❌ ERROR: ' + error.message;
                details.innerHTML += '<p style="color: red;">Error: ' + error.message + '</p>';
            }
        }
        
        // Start test when page loads
        window.addEventListener('load', testLoginFlow);
    </script>
</body>
</html>
