<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - Team Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f9fafb;
            color: #111827;
            line-height: 1.5;
        }

        /* Login Styles */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #374151;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .btn {
            width: 100%;
            padding: 1.2rem;
            margin: 0.5rem 0;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #10b981, #059669);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .link-btn {
            background: none;
            border: none;
            color: #3b82f6;
            text-decoration: underline;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }

        .link-btn:hover {
            color: #1d4ed8;
        }

        .message {
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: #dcfce7;
            color: #059669;
        }

        .message.error {
            background: #fee2e2;
            color: #dc2626;
        }

        .hidden {
            display: none;
        }

        /* Dashboard Styles */
        .header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 32px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #2563eb;
            margin-right: 48px;
        }
        
        .search-bar {
            flex: 1;
            max-width: 400px;
            position: relative;
            margin-right: 24px;
        }
        
        .search-input {
            width: 100%;
            padding: 8px 40px 8px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .notification-bell {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .notification-bell:hover {
            background: #e5e7eb;
        }
        
        .notification-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: #dc2626;
            color: white;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 64px;
            width: 280px;
            height: calc(100vh - 64px);
            background: #f9fafb;
            border-right: 1px solid #e5e7eb;
            padding: 24px 0;
            overflow-y: auto;
        }
        
        .nav-menu {
            list-style: none;
            padding: 0 16px;
        }
        
        .nav-item {
            margin-bottom: 4px;
        }
        
        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: #6b7280;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .nav-link.active {
            background: #dbeafe;
            color: #2563eb;
        }
        
        .nav-link:hover {
            background: #f3f4f6;
            color: #374151;
        }
        
        .nav-icon {
            margin-right: 12px;
            font-size: 20px;
        }
        
        .nav-badge {
            margin-left: auto;
            background: #dc2626;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .main-content {
            margin-left: 280px;
            margin-top: 64px;
            padding: 32px;
            min-height: calc(100vh - 64px);
        }
        
        .page-header {
            margin-bottom: 32px;
        }
        
        .page-title {
            font-size: 36px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 8px;
        }
        
        .page-subtitle {
            color: #6b7280;
            font-size: 16px;
        }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .kpi-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.2s;
        }
        
        .kpi-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .kpi-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .kpi-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 24px;
        }
        
        .kpi-icon.tasks {
            background: #dbeafe;
            color: #2563eb;
        }
        
        .kpi-icon.completed {
            background: #dcfce7;
            color: #059669;
        }
        
        .kpi-icon.overdue {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .kpi-icon.utilization {
            background: #fef3c7;
            color: #d97706;
        }
        
        .kpi-value {
            font-size: 36px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 4px;
        }
        
        .kpi-label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .kpi-trend {
            display: flex;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
        }
        
        .kpi-trend.positive {
            color: #059669;
        }
        
        .kpi-trend.negative {
            color: #dc2626;
        }
        
        .trend-arrow {
            margin-right: 4px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        
        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #111827;
        }
        
        .section-actions {
            display: flex;
            gap: 12px;
        }
        
        .btn-small {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary-small {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
        }
        
        .btn-primary-small:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .btn-secondary-small {
            background: white;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        
        .btn-secondary-small:hover {
            background: #f9fafb;
        }
        
        .team-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }
        
        .employee-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        
        .employee-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .employee-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .employee-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 700;
            margin-right: 16px;
        }
        
        .employee-info h3 {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 4px;
        }
        
        .employee-info p {
            color: #6b7280;
            font-size: 14px;
        }
        
        .workload-section {
            margin-bottom: 20px;
        }
        
        .workload-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .workload-label {
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }
        
        .workload-count {
            font-size: 14px;
            font-weight: 600;
        }
        
        .workload-bar {
            height: 12px;
            background: #f3f4f6;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        
        .workload-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s ease;
        }
        
        .workload-light {
            background: linear-gradient(135deg, #059669 0%, #34d399 100%);
        }
        
        .workload-normal {
            background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
        }
        
        .workload-heavy {
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
        }
        
        .workload-critical {
            background: linear-gradient(135deg, #dc2626 0%, #f87171 100%);
        }
        
        .task-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .task-stat {
            text-align: center;
            padding: 12px 8px;
            border-radius: 8px;
            background: #f9fafb;
        }
        
        .task-stat-value {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .task-stat-label {
            font-size: 12px;
            color: #6b7280;
        }
        
        .task-stat.completed .task-stat-value {
            color: #059669;
        }
        
        .task-stat.pending .task-stat-value {
            color: #d97706;
        }
        
        .task-stat.overdue .task-stat-value {
            color: #dc2626;
        }
        
        .employee-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary-sm {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
        }

        .btn-secondary-sm {
            background: white;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        
        .status-indicator {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid white;
        }
        
        .status-available {
            background: #059669;
        }
        
        .status-busy {
            background: #d97706;
        }
        
        .status-offline {
            background: #6b7280;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #dc2626;
        }
        
        /* Responsive */
        @media (max-width: 1200px) {
            .team-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .team-grid {
                grid-template-columns: 1fr;
            }
            
            .kpi-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- หน้าแรก - เลือกระหว่างสมัครหรือเข้าสู่ระบบ -->
        <div id="welcome-page">
            <div class="login-card">
                <h1 class="title">📊 TaskFlow Pro</h1>
                <p class="subtitle">ระบบจัดการทีมงานขั้นสูง</p>
                
                <button class="btn btn-primary" onclick="showLoginForm()">
                    🔐 ลงชื่อเข้าใช้
                </button>
                
                <button class="btn btn-secondary" onclick="showRegisterForm()">
                    ✨ สมัครสมาชิก
                </button>

                <div style="margin-top: 2rem; padding: 1.2rem; background: #f8fafc; border-radius: 12px; font-size: 0.9rem; color: #64748b; text-align: left;">
                    <strong>🚀 ฟีเจอร์ขั้นสูง:</strong><br />
                    ✅ ระบบควบคุมการเข้าถึงตามบทบาท<br />
                    ✅ เชื่อมต่อกับ ClickUp พร้อมใช้งาน<br />
                    ✅ วิเคราะห์ทีมแบบ Real-time<br />
                    ✅ จัดการภาระงานขั้นสูง
                </div>
            </div>
        </div>

        <!-- ฟอร์มลงชื่อเข้าใช้ -->
        <div id="login-page" class="hidden">
            <div class="login-card">
                <h1 class="title">🔐 ลงชื่อเข้าใช้</h1>
                <p class="subtitle">เข้าสู่ระบบ TaskFlow Pro</p>
                
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">อีเมล</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">รหัสผ่าน</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">เข้าสู่ระบบ</button>
                </form>

                <div class="message" id="login-message"></div>

                <button class="link-btn" onclick="showWelcomePage()">
                    ← กลับหน้าแรก
                </button>
            </div>
        </div>

        <!-- ฟอร์มสมัครสมาชิก -->
        <div id="register-page" class="hidden">
            <div class="login-card">
                <h1 class="title">✨ สมัครสมาชิก</h1>
                <p class="subtitle">สร้างบัญชีใหม่</p>
                
                <form id="register-form">
                    <div class="form-group">
                        <label for="reg-name">ชื่อ-นามสกุล</label>
                        <input type="text" id="reg-name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-email">อีเมล</label>
                        <input type="email" id="reg-email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-password">รหัสผ่าน</label>
                        <input type="password" id="reg-password" name="password" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="reg-role">บทบาท</label>
                        <select id="reg-role" name="role" required>
                            <option value="">เลือกบทบาท</option>
                            <option value="employee">พนักงาน (Employee)</option>
                            <option value="teamlead">หัวหน้าทีม (Team Lead)</option>
                            <option value="manager">ผู้จัดการ (Manager)</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-secondary">สมัครสมาชิก</button>
                </form>

                <div class="message" id="register-message"></div>

                <button class="link-btn" onclick="showWelcomePage()">
                    ← กลับหน้าแรก
                </button>
            </div>
        </div>

        <!-- หน้า Dashboard หลังจาก Login -->
        <div id="dashboard-page" class="hidden">
            <!-- Header -->
            <header class="header">
                <div class="logo">📊 TaskFlow Pro</div>
                
                <div class="search-bar">
                    <input type="text" class="search-input" placeholder="ค้นหาพนักงาน, งาน, โครงการ...">
                    <span class="search-icon">🔍</span>
                </div>
                
                <div class="header-actions">
                    <div class="notification-bell" onclick="showNotifications()">
                        <span>🔔</span>
                        <div class="notification-badge">3</div>
                    </div>
                    <div class="user-avatar" id="user-avatar">ผ</div>
                    <button class="logout-btn" onclick="logout()">ออกจากระบบ</button>
                </div>
            </header>

            <!-- Sidebar -->
            <aside class="sidebar">
                <nav>
                    <ul class="nav-menu" id="nav-menu">
                        <!-- Navigation items will be populated based on role -->
                    </ul>
                </nav>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <div id="dashboard-content">
                    <!-- Dashboard content will be loaded here -->
                </div>
            </main>
        </div>
    </div>

    <script>
        let currentUser = null;
        let dashboardData = null;

        // จัดการการแสดงหน้าต่างๆ
        function showPage(pageId) {
            document.getElementById('welcome-page').classList.add('hidden');
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('register-page').classList.add('hidden');
            document.getElementById('dashboard-page').classList.add('hidden');
            
            document.getElementById(pageId).classList.remove('hidden');
        }

        function showWelcomePage() {
            showPage('welcome-page');
        }

        function showLoginForm() {
            showPage('login-page');
        }

        function showRegisterForm() {
            showPage('register-page');
        }

        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `message ${type}`;
            element.style.display = 'block';
            
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        // ฟังก์ชัน Login
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('userData', JSON.stringify(data.user));
                    
                    showMessage('login-message', 'เข้าสู่ระบบสำเร็จ!', 'success');
                    
                    setTimeout(() => {
                        loadDashboard(data.user);
                    }, 1000);
                } else {
                    showMessage('login-message', data.message || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('login-message', 'เกิดข้อผิดพลาด กรุณาลองอีกครั้ง', 'error');
            }
        });

        // ฟังก์ชัน Register
        document.getElementById('register-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const role = document.getElementById('reg-role').value;

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password, role })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('register-message', 'สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ', 'success');
                    
                    setTimeout(() => {
                        showLoginForm();
                    }, 2000);
                } else {
                    showMessage('register-message', data.message || 'ไม่สามารถสมัครสมาชิกได้', 'error');
                }
            } catch (error) {
                console.error('Register error:', error);
                showMessage('register-message', 'เกิดข้อผิดพลาด กรุณาลองอีกครั้ง', 'error');
            }
        });

        // โหลด Dashboard ตาม Role
        async function loadDashboard(user) {
            currentUser = user;
            showPage('dashboard-page');
            
            // Update user avatar
            document.getElementById('user-avatar').textContent = user.avatar;
            
            try {
                const token = localStorage.getItem('authToken');
                const headers = {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                };

                // โหลดข้อมูลจาก API
                const [kpiResponse, tasksResponse, teamsResponse] = await Promise.all([
                    fetch('/api/v1/dashboard/kpis', { headers }),
                    fetch('/api/v1/tasks', { headers }),
                    user.role !== 'employee' ? fetch('/api/v1/teams', { headers }) : Promise.resolve({json: () => ({teams: []})})
                ]);

                const kpiData = await kpiResponse.json();
                const tasksData = await tasksResponse.json();
                const teamsData = user.role !== 'employee' ? await teamsResponse.json() : {teams: []};

                dashboardData = {
                    kpis: kpiData.kpis || {},
                    tasks: tasksData.tasks || [],
                    teams: teamsData.teams || []
                };

                // สร้าง Navigation ตาม Role
                createNavigation(user.role);
                
                // สร้าง Dashboard Content ตาม Role
                createDashboardContent(user, dashboardData);

            } catch (error) {
                console.error('Dashboard loading error:', error);
                document.getElementById('dashboard-content').innerHTML = `
                    <div style="text-align: center; padding: 2rem;">
                        <h2 style="color: #ef4444;">เกิดข้อผิดพลาดในการโหลด Dashboard</h2>
                        <p>กรุณาลองใหม่อีกครั้ง</p>
                    </div>
                `;
            }
        }

            ];

            let navItems = [...commonNavItems];

            if (role === 'manager') {
                navItems.push(
                    { icon: '👥', text: 'จัดการทีม' },
                    { icon: '📈', text: 'Analytics' },
                    { icon: '📁', text: 'โครงการ' },
                    { icon: '⚙️', text: 'การตั้งค่า' }
                );
            } else if (role === 'teamlead') {
                navItems.push(
                    { icon: '👥', text: 'ทีมของฉัน' },
                    { icon: '📈', text: 'รายงานทีม' },

                );
            }

            navMenu.innerHTML = navItems.map(item => `
                <li class="nav-item">
                    <div class="nav-link ${item.active ? 'active' : ''}">
                        <span class="nav-icon">${item.icon}</span>
                        ${item.text}
                        ${item.badge ? `<span class="nav-badge">${item.badge}</span>` : ''}

        }

        function createTeamGrid(tasks, isTeamLead = false) {

                { id: 'ว', name: 'วิทยา ดาต้าเบส', position: 'Database Admin', tasks: 9, maxTasks: 8, completed: 6, pending: 2, overdue: 1, status: 'offline' }
            ];

            return `

                                </div>
                                <div class="workload-bar">
                                    <div class="workload-fill ${getWorkloadClass(member.tasks, member.maxTasks)}" style="width: ${Math.min((member.tasks / member.maxTasks) * 100, 120)}%"></div>

                            </div>

                            <div class="task-stats">
                                <div class="task-stat completed">

                                    <div class="task-stat-label">เสร็จแล้ว</div>
                                </div>
                                <div class="task-stat pending">
                                    <div class="task-stat-value">${member.pending}</div>
                                    <div class="task-stat-label">กำลังทำ</div>
                                </div>
                                <div class="task-stat overdue">

                                </div>

                                <button class="btn-sm btn-secondary-sm">ดูรายละเอียด</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function createTaskList(tasks) {
            if (!tasks || tasks.length === 0) {
                return '<p style="text-align: center; color: #6b7280; padding: 2rem;">ไม่มีงานในขณะนี้</p>';
            }

            return `
                <div style="background: white; border-radius: 12px; padding: 1.5rem;">
                    ${tasks.slice(0, 5).map(task => `
                        <div style="padding: 1rem; border-bottom: 1px solid #f3f4f6; border-left: 4px solid ${getTaskPriorityColor(task.priority)};">
                            <div style="font-weight: 600; color: #111827; margin-bottom: 0.5rem;">${task.title}</div>
                            <div style="color: #6b7280; font-size: 0.9rem; margin-bottom: 0.5rem;">${task.description}</div>
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <span style="background: ${getStatusBgColor(task.status)}; color: white; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem;">${getStatusDisplayName(task.status)}</span>
                                <span style="color: #6b7280; font-size: 0.8rem;">ความคืบหน้า: ${task.progress}%</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function getWorkloadClass(current, max) {
            const ratio = current / max;
            if (ratio <= 0.5) return 'workload-light';
            if (ratio <= 0.8) return 'workload-normal';
            if (ratio <= 1.0) return 'workload-heavy';
            return 'workload-critical';
        }

        function getTaskPriorityColor(priority) {
            const colors = { 'high': '#ef4444', 'medium': '#f59e0b', 'low': '#10b981' };
            return colors[priority] || '#6b7280';
        }

        function getStatusBgColor(status) {
            const colors = { 'completed': '#10b981', 'in_progress': '#3b82f6', 'todo': '#6b7280', 'overdue': '#ef4444' };
            return colors[status] || '#6b7280';
        }

        function getStatusDisplayName(status) {
            const names = { 'completed': 'เสร็จแล้ว', 'in_progress': 'กำลังดำเนินการ', 'todo': 'รอดำเนินการ', 'overdue': 'เกินกำหนด' };
            return names[status] || status;
        }

        function showNotifications() {
            alert('📬 คุณมีการแจ้งเตือน 3 รายการ:\n\n1. งาน "Project Report" เกินกำหนดแล้ว\n2. สมชาย มีงานเกินขีดจำกัด\n3. อรุณ พร้อมรับงานใหม่');
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userData');
            currentUser = null;
            dashboardData = null;
            showWelcomePage();
        }

        // ตรวจสอบว่าเข้าสู่ระบบแล้วหรือยัง
        window.onload = function() {
            const token = localStorage.getItem('authToken');
            const userData = localStorage.getItem('userData');
            
            if (token && userData) {
                try {
                    const user = JSON.parse(userData);
                    loadDashboard(user);
                } catch (error) {
                    console.error('Error parsing user data:', error);
                    localStorage.removeItem('authToken');
                    localStorage.removeItem('userData');
                    showWelcomePage();
                }
            } else {
                showWelcomePage();
            }
        };
    </script>
