<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - Team Management Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif; background: #f8fafc; }
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #3b82f6, #2563eb); padding: 20px; }
        .login-card { background: white; padding: 3rem; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; }
        .login-title { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .login-subtitle { color: #475569; margin-bottom: 2rem; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .form-input { width: 100%; padding: 0.75rem; border: 1px solid #e2e8f0; border-radius: 8px; }
        .login-btn { width: 100%; padding: 1rem; background: #3b82f6; color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer; }
        .header { background: white; border-bottom: 1px solid #e2e8f0; height: 70px; display: flex; align-items: center; padding: 0 2rem; position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
        .header-title { font-size: 1.5rem; font-weight: 700; color: #3b82f6; margin-right: auto; }
        .user-profile { display: flex; align-items: center; gap: 0.75rem; }
        .logout-btn { padding: 0.5rem 1rem; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; }
        .main-content { margin-top: 70px; padding: 2rem; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-bottom: 2rem; }
        .card { background: white; border-radius: 16px; padding: 1.5rem; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1); }
        .kpi-value { font-size: 3rem; font-weight: 700; margin-bottom: 0.5rem; color: #3b82f6; }
        .kpi-label { color: #475569; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function LoginPage({ onLogin }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                onLogin(email, password);
            };

            return (
                <div className="login-container">
                    <div className="login-card">
                        <h1 className="login-title">TaskFlow Pro</h1>
                        <p className="login-subtitle">Team Management Dashboard</p>
                        
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">Email</label>
                                <input
                                    type="email"
                                    className="form-input"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    required
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Password</label>
                                <input
                                    type="password"
                                    className="form-input"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    required
                                />
                            </div>
                            <button type="submit" className="login-btn">
                                Login
                            </button>
                        </form>
                        
                        <div style={{ marginTop: '1rem', fontSize: '0.85rem', color: '#64748b' }}>
                            Demo: yterayut@gmail.com / 12345
                        </div>
                    </div>
                </div>
            );
        }

        function Header({ user, onLogout }) {
            return (
                <div className="header">
                    <div className="header-title">TaskFlow Pro</div>
                    <div className="user-profile">
                        <span>{user?.name}</span>
                        <button className="logout-btn" onClick={onLogout}>
                            Logout
                        </button>
                    </div>
                </div>
            );
        }

        function Dashboard() {
            return (
                <div className="main-content">
                    <h1 style={{ fontSize: '2rem', fontWeight: '700', marginBottom: '2rem' }}>
                        Dashboard
                    </h1>
                    
                    <div className="dashboard-grid">
                        <div className="card">
                            <div className="kpi-value">24</div>
                            <div className="kpi-label">Total Tasks</div>
                        </div>
                        <div className="card">
                            <div className="kpi-value">18</div>
                            <div className="kpi-label">Completed</div>
                        </div>
                        <div className="card">
                            <div className="kpi-value">4</div>
                            <div className="kpi-label">In Progress</div>
                        </div>
                        <div className="card">
                            <div className="kpi-value">2</div>
                            <div className="kpi-label">Overdue</div>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);

            const userDatabase = {
                'yterayut@gmail.com': {
                    name: 'Teerayut Yeerahem',
                    email: 'yterayut@gmail.com',
                    role: 'Manager',
                    password: '12345'
                }
            };

            const handleLogin = (email, password) => {
                const user = userDatabase[email];
                if (user && user.password === password) {
                    setCurrentUser(user);
                    setIsAuthenticated(true);
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    localStorage.setItem('authToken', 'demo_token');
                    localStorage.setItem('loginMode', 'credentials');
                } else {
                    alert('Invalid credentials');
                }
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                setCurrentUser(null);
                localStorage.removeItem('currentUser');
                localStorage.removeItem('authToken');
                localStorage.removeItem('loginMode');
            };

            useEffect(() => {
                const savedUser = localStorage.getItem('currentUser');
                const authToken = localStorage.getItem('authToken');
                if (savedUser && authToken) {
                    setCurrentUser(JSON.parse(savedUser));
                    setIsAuthenticated(true);
                }
            }, []);

            if (!isAuthenticated) {
                return <LoginPage onLogin={handleLogin} />;
            }

            return (
                <div>
                    <Header user={currentUser} onLogout={handleLogout} />
                    <Dashboard />
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
