<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - Team Management Dashboard</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f9fafb;
            color: #111827;
            line-height: 1.5;
        }
        
        /* Header */
        .header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 32px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
        }
        
        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #2563eb;
            margin-right: 48px;
        }
        
        .search-bar {
            flex: 1;
            max-width: 400px;
            position: relative;
            margin-right: 24px;
        }
        
        .search-input {
            width: 100%;
            padding: 8px 40px 8px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .search-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }
        
        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .notification-bell {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .notification-bell:hover {
            background: #e5e7eb;
        }
        
        .notification-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: #dc2626;
            color: white;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 64px;
            width: 280px;
            height: calc(100vh - 64px);
            background: #f9fafb;
            border-right: 1px solid #e5e7eb;
            padding: 24px 0;
            overflow-y: auto;
        }
        
        .nav-menu {
            list-style: none;
            padding: 0 16px;
        }
        
        .nav-item {
            margin-bottom: 4px;
        }
        
        .nav-link {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-radius: 8px;
            text-decoration: none;
            color: #6b7280;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .nav-link.active {
            background: #dbeafe;
            color: #2563eb;
        }
        
        .nav-link:hover {
            background: #f3f4f6;
            color: #374151;
        }
        
        .nav-icon {
            margin-right: 12px;
            font-size: 20px;
        }
        
        .nav-badge {
            margin-left: auto;
            background: #dc2626;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        /* Main Content */
        .main-content {
            margin-left: 280px;
            margin-top: 64px;
            padding: 32px;
            min-height: calc(100vh - 64px);
        }
        
        .page-header {
            margin-bottom: 32px;
        }
        
        .page-title {
            font-size: 36px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 8px;
        }
        
        .page-subtitle {
            color: #6b7280;
            font-size: 16px;
        }
        
        /* KPI Cards */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .kpi-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.2s;
        }
        
        .kpi-card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .kpi-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .kpi-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 16px;
            font-size: 24px;
        }
        
        .kpi-icon.tasks {
            background: #dbeafe;
            color: #2563eb;
        }
        
        .kpi-icon.completed {
            background: #dcfce7;
            color: #059669;
        }
        
        .kpi-icon.overdue {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .kpi-icon.utilization {
            background: #fef3c7;
            color: #d97706;
        }
        
        .kpi-value {
            font-size: 36px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 4px;
        }
        
        .kpi-label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .kpi-trend {
            display: flex;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
        }
        
        .kpi-trend.positive {
            color: #059669;
        }
        
        .kpi-trend.negative {
            color: #dc2626;
        }
        
        .trend-arrow {
            margin-right: 4px;
        }
        
        /* Team Section */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        
        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #111827;
        }
        
        .section-actions {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .btn-secondary {
            background: white;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        
        .btn-secondary:hover {
            background: #f9fafb;
        }
        
        /* Team Grid */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 32px;
        }
        
        .employee-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        
        .employee-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }
        
        .employee-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .employee-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: 700;
            margin-right: 16px;
        }
        
        .employee-info h3 {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
            margin-bottom: 4px;
        }
        
        .employee-info p {
            color: #6b7280;
            font-size: 14px;
        }
        
        .workload-section {
            margin-bottom: 20px;
        }
        
        .workload-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .workload-label {
            font-size: 14px;
            font-weight: 500;
            color: #374151;
        }
        
        .workload-count {
            font-size: 14px;
            font-weight: 600;
        }
        
        .workload-bar {
            height: 12px;
            background: #f3f4f6;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        
        .workload-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.3s ease;
        }
        
        .workload-light {
            background: linear-gradient(135deg, #059669 0%, #34d399 100%);
        }
        
        .workload-normal {
            background: linear-gradient(135deg, #2563eb 0%, #60a5fa 100%);
        }
        
        .workload-heavy {
            background: linear-gradient(135deg, #d97706 0%, #f59e0b 100%);
        }
        
        .workload-critical {
            background: linear-gradient(135deg, #dc2626 0%, #f87171 100%);
        }
        
        .task-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .task-stat {
            text-align: center;
            padding: 12px 8px;
            border-radius: 8px;
            background: #f9fafb;
        }
        
        .task-stat-value {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .task-stat-label {
            font-size: 12px;
            color: #6b7280;
        }
        
        .task-stat.completed .task-stat-value {
            color: #059669;
        }
        
        .task-stat.pending .task-stat-value {
            color: #d97706;
        }
        
        .task-stat.overdue .task-stat-value {
            color: #dc2626;
        }
        
        .employee-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
        }
        
        /* Status Indicators */
        .status-indicator {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid white;
        }
        
        .status-available {
            background: #059669;
        }
        
        .status-busy {
            background: #d97706;
        }
        
        .status-offline {
            background: #6b7280;
        }

        /* Login Screen */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .login-title {
            font-size: 2rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: #64748b;
            margin-bottom: 2rem;
        }

        .role-button {
            width: 100%;
            padding: 1rem;
            margin: 0.5rem 0;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .role-button.manager {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
        }

        .role-button.teamlead {
            background: linear-gradient(45deg, #48cae4, #023e8a);
            color: white;
        }

        .role-button.employee {
            background: linear-gradient(45deg, #06ffa5, #0d7377);
            color: white;
        }

        .role-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        /* Toast Notifications */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background: linear-gradient(45deg, #10b981, #059669);
        }

        .toast.error {
            background: linear-gradient(45deg, #ef4444, #dc2626);
        }

        .toast.info {
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* Responsive */
        @media (max-width: 1200px) {
            .team-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .team-grid {
                grid-template-columns: 1fr;
            }
            
            .kpi-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const TaskFlowPro = () => {
            const [currentRole, setCurrentRole] = useState(null);
            const [notifications, setNotifications] = useState([]);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [dashboardData, setDashboardData] = useState(null);
            const [userInfo, setUserInfo] = useState(null);

            // Update time every minute
            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentTime(new Date());
                }, 60000);
                return () => clearInterval(timer);
            }, []);

            // Check for existing authentication on page load
            useEffect(() => {
                const token = localStorage.getItem('authToken');
                const userData = localStorage.getItem('userData');
                const storedDashboardData = localStorage.getItem('dashboardData');
                
                if (token && userData) {
                    try {
                        const user = JSON.parse(userData);
                        setCurrentRole(user.role);
                        setUserInfo(user);
                        
                        if (storedDashboardData) {
                            setDashboardData(JSON.parse(storedDashboardData));
                        }
                        
                        // Refresh dashboard data
                        loadDashboardData(user.role);
                    } catch (error) {
                        console.error('Error parsing stored data:', error);
                        // Clear invalid data
                        localStorage.removeItem('authToken');
                        localStorage.removeItem('userData');
                        localStorage.removeItem('dashboardData');
                    }
                }
            }, []);

            // Sample data
            const userData = {
                manager: {
                    name: 'ประยุทธ์ ผู้จัดการ',
                    avatar: 'ป',
                    role: 'ผู้จัดการ'
                },
                teamlead: {
                    name: 'สมศักดิ์ หัวหน้าทีม',
                    avatar: 'ส',
                    role: 'หัวหน้าทีม Frontend'
                },
                employee: {
                    name: 'กิตติพงษ์ สมศรี',
                    avatar: 'ก',
                    role: 'Senior Developer'
                }
            };

            const teamData = {
                frontend: [
                    { 
                        id: 1, 
                        name: 'กิตติพงษ์ สมศรี', 
                        position: 'Senior Developer', 
                        tasks: 7, 
                        maxTasks: 10, 
                        avatar: 'ก',
                        completed: 5,
                        pending: 2,
                        overdue: 0,
                        status: 'available'
                    },
                    { 
                        id: 2, 
                        name: 'นภัสสร จันทร์เพ็ญ', 
                        position: 'UI/UX Designer', 
                        tasks: 4, 
                        maxTasks: 8, 
                        avatar: 'น',
                        completed: 2,
                        pending: 2,
                        overdue: 0,
                        status: 'busy'
                    },
                    { 
                        id: 3, 
                        name: 'อรุณ ใจดี', 
                        position: 'Frontend Developer', 
                        tasks: 3, 
                        maxTasks: 8, 
                        avatar: 'อ',
                        completed: 1,
                        pending: 2,
                        overdue: 0,
                        status: 'available'
                    },
                    { 
                        id: 4, 
                        name: 'สมหญิง วัฒนา', 
                        position: 'Junior Developer', 
                        tasks: 12, 
                        maxTasks: 10, 
                        avatar: 'ส',
                        completed: 8,
                        pending: 2,
                        overdue: 2,
                        status: 'busy'
                    }
                ],
                backend: [
                    { 
                        id: 5, 
                        name: 'สมชาย พัฒนา', 
                        position: 'Backend Lead', 
                        tasks: 6, 
                        maxTasks: 8, 
                        avatar: 'ส',
                        completed: 4,
                        pending: 2,
                        overdue: 0,
                        status: 'available'
                    },
                    { 
                        id: 6, 
                        name: 'วิทยา ดาต้าเบส', 
                        position: 'Database Admin', 
                        tasks: 9, 
                        maxTasks: 8, 
                        avatar: 'ว',
                        completed: 6,
                        pending: 2,
                        overdue: 1,
                        status: 'offline'
                    }
                ]
            };

            const kpiData = {
                manager: {
                    totalTasks: 145,
                    completed: 98,
                    overdue: 12,
                    efficiency: 78
                },
                teamlead: {
                    totalTasks: 22,
                    completed: 15,
                    overdue: 2,
                    efficiency: 87
                },
                employee: {
                    totalTasks: 7,
                    completed: 5,
                    overdue: 0,
                    efficiency: 95
                }
            };

            const showToast = (message, type = 'info') => {
                const toast = { id: Date.now(), message, type };
                setNotifications(prev => [...prev, toast]);
                setTimeout(() => {
                    setNotifications(prev => prev.filter(n => n.id !== toast.id));
                }, 3000);
            };

            const login = async (role) => {
                try {
                    const response = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ role })
                    });

                    const data = await response.json();

                    if (data.success) {
                        // Store token in localStorage
                        localStorage.setItem('authToken', data.token);
                        localStorage.setItem('userData', JSON.stringify(data.user));
                        
                        setCurrentRole(data.user.role);
                        setUserInfo(data.user);
                        showToast(`เข้าสู่ระบบในฐานะ ${data.user.name}`, 'success');
                        
                        // Load dashboard data based on role
                        loadDashboardData(data.user.role);
                    } else {
                        showToast('ไม่สามารถเข้าสู่ระบบได้', 'error');
                    }
                } catch (error) {
                    console.error('Login error:', error);
                    showToast('เกิดข้อผิดพลาดในการเข้าสู่ระบบ', 'error');
                }
            };

            const logout = () => {
                // Clear stored tokens and data
                localStorage.removeItem('authToken');
                localStorage.removeItem('userData');
                localStorage.removeItem('dashboardData');
                
                setCurrentRole(null);
                setUserInfo(null);
                setDashboardData(null);
                showToast('ออกจากระบบเรียบร้อย', 'info');
            };

            const loadDashboardData = async (role) => {
                try {
                    const token = localStorage.getItem('authToken');
                    if (!token) return;

                    const headers = {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    };

                    // Load KPIs
                    const kpiResponse = await fetch('/api/v1/dashboard/kpis', { headers });
                    const kpiData = await kpiResponse.json();

                    // Load tasks if needed
                    const tasksResponse = await fetch('/api/v1/tasks', { headers });
                    const tasksData = await tasksResponse.json();

                    // Load teams if manager or team lead
                    let teamsData = null;
                    if (role === 'manager' || role === 'teamlead') {
                        const teamsResponse = await fetch('/api/v1/teams', { headers });
                        teamsData = await teamsResponse.json();
                    }

                    // Store dashboard data
                    const newDashboardData = {
                        kpis: kpiData.kpis,
                        tasks: tasksData.tasks,
                        teams: teamsData?.teams
                    };
                    
                    localStorage.setItem('dashboardData', JSON.stringify(newDashboardData));
                    setDashboardData(newDashboardData);
                } catch (error) {
                    console.error('Failed to load dashboard data:', error);
                    showToast('ไม่สามารถโหลดข้อมูลได้', 'error');
                }
            };

            // Components
            const LoginScreen = () => (
                <div className="login-container">
                    <div className="login-card">
                        <h1 className="login-title">📊 TaskFlow Pro</h1>
                        <p className="login-subtitle">Advanced Team Management System</p>
                        
                        <button className="role-button manager" onClick={() => login('manager')}>
                            👨‍💼 เข้าสู่ระบบในฐานะ Manager
                        </button>
                        
                        <button className="role-button teamlead" onClick={() => login('teamlead')}>
                            👨‍💻 เข้าสู่ระบบในฐานะ Team Lead
                        </button>
                        
                        <button className="role-button employee" onClick={() => login('employee')}>
                            👨‍🔧 เข้าสู่ระบบในฐานะ Employee
                        </button>

                        <div style={{marginTop: '2rem', padding: '1rem', background: '#f8fafc', borderRadius: '8px', fontSize: '0.9rem', color: '#64748b'}}>
                            <strong>Enterprise Features:</strong><br />
                            ✅ Role-Based Access Control<br />
                            ✅ ClickUp Integration Ready<br />
                            ✅ Real-time Team Analytics<br />
                            ✅ Advanced Workload Management
                        </div>
                    </div>
                </div>
            );

            const Header = () => (
                <header className="header">
                    <div className="logo">📊 TaskFlow Pro</div>
                    
                    <div className="search-bar">
                        <input type="text" className="search-input" placeholder="ค้นหาพนักงาน, งาน, โครงการ..." />
                        <span className="search-icon">🔍</span>
                    </div>
                    
                    <div className="header-actions">
                        <div className="notification-bell" onClick={() => showToast('📬 คุณมีการแจ้งเตือน 3 รายการ', 'info')}>
                            <span>🔔</span>
                            <div className="notification-badge">3</div>
                        </div>
                        <div className="user-avatar" onClick={logout}>
                            {userInfo?.avatar || userData[currentRole]?.avatar}
                        </div>
                    </div>
                </header>
            );

            const Sidebar = () => (
                <aside className="sidebar">
                    <nav>
                        <ul className="nav-menu">
                            <li className="nav-item">
                                <div className="nav-link active">
                                    <span className="nav-icon">📊</span>
                                    Dashboard
                                </div>
                            </li>
                            <li className="nav-item">
                                <div className="nav-link" onClick={() => showToast('กำลังเปิดหน้า Team Management...', 'info')}>
                                    <span className="nav-icon">👥</span>
                                    Team Management
                                </div>
                            </li>
                            <li className="nav-item">
                                <div className="nav-link" onClick={() => showToast('กำลังเปิดหน้า Task Center...', 'info')}>
                                    <span className="nav-icon">📋</span>
                                    Task Center
                                    <span className="nav-badge">12</span>
                                </div>
                            </li>
                            <li className="nav-item">
                                <div className="nav-link" onClick={() => showToast('กำลังเปิดหน้า Analytics...', 'info')}>
                                    <span className="nav-icon">📈</span>
                                    Analytics
                                </div>
                            </li>
                            <li className="nav-item">
                                <div className="nav-link" onClick={() => showToast('กำลังเปิดหน้า Projects...', 'info')}>
                                    <span className="nav-icon">📁</span>
                                    Projects
                                </div>
                            </li>
                            {currentRole === 'manager' && (
                                <li className="nav-item">
                                    <div className="nav-link" onClick={() => showToast('กำลังเปิดหน้า Settings...', 'info')}>
                                        <span className="nav-icon">⚙️</span>
                                        Settings
                                    </div>
                                </li>
                            )}
                        </ul>
                    </nav>
                </aside>
            );

            const KPICard = ({ icon, iconClass, value, label, trend, trendType }) => (
                <div className="kpi-card">
                    <div className="kpi-header">
                        <div className={`kpi-icon ${iconClass}`}>{icon}</div>
                    </div>
                    <div className="kpi-value">{value}</div>
                    <div className="kpi-label">{label}</div>
                    <div className={`kpi-trend ${trendType}`}>
                        <span className="trend-arrow">{trendType === 'positive' ? '↗️' : '↘️'}</span>
                        {trend}
                    </div>
                </div>
            );

            const EmployeeCard = ({ employee, onClick }) => {
                const workloadPercentage = (employee.tasks / employee.maxTasks) * 100;
                let workloadClass = 'workload-light';
                if (workloadPercentage > 100) workloadClass = 'workload-critical';
                else if (workloadPercentage > 80) workloadClass = 'workload-heavy';
                else if (workloadPercentage > 50) workloadClass = 'workload-normal';

                const statusClass = `status-${employee.status}`;

                return (
                    <div className="employee-card" onClick={() => onClick(employee)}>
                        <div className={`status-indicator ${statusClass}`}></div>
                        <div className="employee-header">
                            <div className="employee-avatar">{employee.avatar}</div>
                            <div className="employee-info">
                                <h3>{employee.name}</h3>
                                <p>{employee.position}</p>
                            </div>
                        </div>

                        <div className="workload-section">
                            <div className="workload-header">
                                <span className="workload-label">Workload</span>
                                <span className="workload-count">{employee.tasks}/{employee.maxTasks} งาน</span>
                            </div>
                            <div className="workload-bar">
                                <div 
                                    className={`workload-fill ${workloadClass}`} 
                                    style={{ width: `${Math.min(workloadPercentage, 100)}%` }}
                                ></div>
                            </div>
                        </div>

                        <div className="task-stats">
                            <div className="task-stat completed">
                                <div className="task-stat-value">{employee.completed}</div>
                                <div className="task-stat-label">เสร็จแล้ว</div>
                            </div>
                            <div className="task-stat pending">
                                <div className="task-stat-value">{employee.pending}</div>
                                <div className="task-stat-label">กำลังทำ</div>
                            </div>
                            <div className="task-stat overdue">
                                <div className="task-stat-value">{employee.overdue}</div>
                                <div className="task-stat-label">เกินกำหนด</div>
                            </div>
                        </div>

                        <div className="employee-actions">
                            {workloadPercentage > 100 ? (
                                <button className="btn btn-secondary btn-sm" onClick={(e) => {e.stopPropagation(); showToast('กำลังจัดสรรงานใหม่...', 'info')}}>
                                    ⚖️ จัดสรรใหม่
                                </button>
                            ) : (
                                <button className="btn btn-primary btn-sm" onClick={(e) => {e.stopPropagation(); showToast('กำลังมอบหมายงาน...', 'info')}}>
                                    + มอบหมายงาน
                                </button>
                            )}
                            <button className="btn btn-secondary btn-sm" onClick={(e) => {e.stopPropagation(); showToast(`ดูรายละเอียด: ${employee.name}`, 'info')}}>
                                ดูรายละเอียด
                            </button>
                        </div>
                    </div>
                );
            };

            // Dashboard Views
            const ManagerDashboard = () => {
                const kpis = dashboardData?.kpis || kpiData.manager;
                return (
                    <main className="main-content">
                        <div className="page-header">
                            <h1 className="page-title">Team Dashboard</h1>
                            <p className="page-subtitle">ภาพรวมการทำงานของทีม • อัพเดทล่าสุด: {currentTime.toLocaleString('th-TH')}</p>
                        </div>

                        <div className="kpi-grid">
                            <KPICard
                                icon="📋"
                                iconClass="tasks"
                                value={kpis.totalTasks || kpis.teamMembers || 0}
                                label="สมาชิกทีม"
                                trend="+12% จากสัปดาห์ที่แล้ว"
                                trendType="positive"
                            />
                            <KPICard
                                icon="✅"
                                iconClass="completed"
                                value={kpis.completedToday || kpis.completed || 0}
                                label="งานเสร็จวันนี้"
                                trend="+8% จากสัปดาห์ที่แล้ว"
                                trendType="positive"
                            />
                            <KPICard
                                icon="⚠️"
                                iconClass="overdue"
                                value={kpis.overdue || 0}
                                label="งานเกินกำหนด"
                                trend="-3% จากสัปดาห์ที่แล้ว"
                                trendType="negative"
                            />
                            <KPICard
                                icon="📊"
                                iconClass="utilization"
                                value={`${kpis.efficiency || 0}%`}
                                label="ประสิทธิภาพทีม"
                                trend="+5% จากสัปดาห์ที่แล้ว"
                                trendType="positive"
                            />
                        </div>

                        <section>
                            <div className="section-header">
                                <h2 className="section-title">Team Workload Overview</h2>
                                <div className="section-actions">
                                    <button className="btn btn-secondary" onClick={() => showToast('กำลัง Auto Balance...', 'info')}>
                                        <span>📊</span>
                                        Auto Balance
                                    </button>
                                    <button className="btn btn-primary" onClick={() => showToast('กำลังมอบหมายงาน...', 'info')}>
                                        <span>➕</span>
                                        Assign Task
                                    </button>
                                </div>
                            </div>

                            <div className="team-grid">
                                {[...teamData.frontend, ...teamData.backend].map(employee => (
                                    <EmployeeCard 
                                        key={employee.id} 
                                        employee={employee} 
                                        onClick={(emp) => showToast(`ดูรายละเอียดพนักงาน: ${emp.name}`, 'info')} 
                                    />
                                ))}
                            </div>
                        </section>
                    </main>
                );
            };

            const TeamLeadDashboard = () => {
                const kpis = dashboardData?.kpis || kpiData.teamlead;
                return (
                    <main className="main-content">
                        <div className="page-header">
                            <h1 className="page-title">Team Lead Dashboard</h1>
                            <p className="page-subtitle">จัดการทีม Frontend Development • อัพเดทล่าสุด: {currentTime.toLocaleString('th-TH')}</p>
                        </div>

                        <div className="kpi-grid">
                            <KPICard
                                icon="📋"
                                iconClass="tasks"
                                value={kpis.teamTasks || kpis.totalTasks || 0}
                                label="งานของทีม"
                                trend="+8% จากสัปดาห์ที่แล้ว"
                                trendType="positive"
                            />
                            <KPICard
                                icon="✅"
                                iconClass="completed"
                                value={kpis.completedToday || kpis.completed || 0}
                                label="เสร็จแล้ว"
                                trend="+10% จากสัปดาห์ที่แล้ว"
                                trendType="positive"
                            />
                            <KPICard
                                icon="⚠️"
                                iconClass="overdue"
                                value={kpis.overdue || 0}
                                label="เกินกำหนด"
                                trend="-2% จากสัปดาห์ที่แล้ว"
                                trendType="negative"
                            />
                            <KPICard
                                icon="📊"
                                iconClass="utilization"
                                value={`${kpis.teamEfficiency || kpis.efficiency || 0}%`}
                                label="ประสิทธิภาพทีม"
                                trend="+7% จากสัปดาห์ที่แล้ว"
                                trendType="positive"
                            />
                        </div>

                        <section>
                            <div className="section-header">
                                <h2 className="section-title">Frontend Team Members</h2>
                                <div className="section-actions">
                                    <button className="btn btn-primary" onClick={() => showToast('กำลังมอบหมายงาน...', 'info')}>
                                        <span>➕</span>
                                        Assign Task
                                    </button>
                                </div>
                            </div>

                            <div className="team-grid">
                                {teamData.frontend.map(employee => (
                                    <EmployeeCard 
                                        key={employee.id} 
                                        employee={employee} 
                                        onClick={(emp) => showToast(`ดูรายละเอียดพนักงาน: ${emp.name}`, 'info')} 
                                    />
                                ))}
                            </div>
                        </section>
                    </main>
                );
            };

            const EmployeeDashboard = () => {
                const kpis = dashboardData?.kpis || kpiData.employee;
                const myData = teamData.frontend[0]; // กิตติพงษ์
                
                return (
                    <main className="main-content">
                        <div className="page-header">
                            <h1 className="page-title">สวัสดี, {userInfo?.name || 'กิตติพงษ์'}!</h1>
                            <p className="page-subtitle">{userInfo?.role || 'Senior Developer'} • อัพเดทล่าสุด: {currentTime.toLocaleString('th-TH')}</p>
                        </div>

                        <div className="kpi-grid">
                            <KPICard
                                icon="📋"
                                iconClass="tasks"
                                value={kpis.totalTasks || 0}
                                label="งานทั้งหมด"
                                trend="+2 งานใหม่สัปดาห์นี้"
                                trendType="positive"
                            />
                            <KPICard
                                icon="✅"
                                iconClass="completed"
                                value={kpis.completedToday || kpis.completedTasks || 0}
                                label="เสร็จแล้ว"
                                trend="+1 งานวันนี้"
                                trendType="positive"
                            />
                            <KPICard
                                icon="⚠️"
                                iconClass="overdue"
                                value={kpis.overdue || 0}
                                label="เกินกำหนด"
                                trend="ไม่มีงานเกินกำหนด"
                                trendType="positive"
                            />
                            <KPICard
                                icon="📊"
                                iconClass="utilization"
                                value={`${kpis.efficiency || 0}%`}
                                label="ประสิทธิภาพ"
                                trend="Employee of the Month!"
                                trendType="positive"
                            />
                        </div>

                        <section>
                            <div className="section-header">
                                <h2 className="section-title">งานของฉัน</h2>
                                <div className="section-actions">
                                    <button className="btn btn-primary" onClick={() => showToast('อัพเดทความคืบหน้าสำเร็จ!', 'success')}>
                                        <span>🔄</span>
                                        Update Progress
                                    </button>
                                </div>
                            </div>

                            <div className="team-grid" style={{gridTemplateColumns: '1fr'}}>
                                <EmployeeCard 
                                    employee={myData} 
                                    onClick={(emp) => showToast(`ดูรายละเอียดงาน: ${emp.name}`, 'info')} 
                                />
                            </div>

                            <div style={{marginTop: '2rem', padding: '1.5rem', background: '#f0fdf4', border: '1px solid #16a34a', borderRadius: '12px', fontSize: '0.9rem', color: '#15803d'}}>
                                <strong>🎯 เป้าหมายสัปดาห์นี้:</strong><br />
                                • เสร็จงาน "Dashboard UI" ภายในวันพุธ<br />
                                • Code Review งาน 2 รายการ<br />
                                • เข้าร่วม Sprint Planning ศุกร์
                            </div>
                        </section>
                    </main>
                );
            };

            // Main render
            const renderContent = () => {
                switch (currentRole) {
                    case 'manager':
                        return <ManagerDashboard />;
                    case 'teamlead':
                        return <TeamLeadDashboard />;
                    case 'employee':
                        return <EmployeeDashboard />;
                    default:
                        return null;
                }
            };

            if (!currentRole) {
                return <LoginScreen />;
            }

            return (
                <div>
                    <Header />
                    <Sidebar />
                    {renderContent()}

                    {/* Toast Notifications */}
                    {notifications.map(notification => (
                        <div key={notification.id} className={`toast ${notification.type}`}>
                            {notification.message}
                        </div>
                    ))}
                </div>
            );
        };

        // Render the application
        const root = ReactDOM.createRoot ? ReactDOM.createRoot(document.getElementById('root')) : null;
        if (root) {
            root.render(<TaskFlowPro />);
        } else {
            ReactDOM.render(<TaskFlowPro />, document.getElementById('root'));
        }
    </script>
</body>
</html>
