<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - PostgreSQL Integration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-blue: #2563eb;
            --primary-purple: #7c3aed;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --success-green: #10b981;
            --warning-orange: #f59e0b;
            --danger-red: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-blue);
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }

        .logout-btn {
            padding: 0.5rem 1rem;
            background: var(--danger-red);
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            transition: background-color 0.2s;
        }

        .logout-btn:hover {
            background: #dc2626;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            min-height: calc(100vh - 80px);
        }

        .sidebar {
            width: 280px;
            background: var(--bg-primary);
            border-right: 1px solid var(--border-color);
            padding: 2rem 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 2rem;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }

        .nav-item:hover,
        .nav-item.active {
            background: var(--bg-secondary);
            color: var(--primary-blue);
        }

        .content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        /* Cards */
        .card {
            background: var(--bg-primary);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--bg-primary);
            border-radius: 1rem;
            padding: 2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-number {
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary-blue);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Data Source Indicator */
        .data-source {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: var(--success-green);
            color: white;
            border-radius: 2rem;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        /* Task Lists */
        .task-list {
            margin-top: 2rem;
        }

        .task-item {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: var(--shadow-sm);
        }

        .task-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .task-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 1rem;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-complete { background: #dcfce7; color: #166534; }
        .status-in-progress { background: #fef3c7; color: #92400e; }
        .status-to-do { background: #e0e7ff; color: #3730a3; }

        /* Loading States */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            color: var(--text-secondary);
        }

        .spinner {
            animate: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Error States */
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        /* Login Form */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
        }

        .login-form {
            background: var(--bg-primary);
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 400px;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .form-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            font-size: 1rem;
            background: var(--bg-primary);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-block {
            width: 100%;
        }

        /* Hidden state */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                padding: 1rem 0;
            }
            
            .nav-item {
                padding: 0.5rem 1rem;
            }
            
            .content {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- Login Form -->
    <div id="loginContainer" class="login-container">
        <form id="loginForm" class="login-form">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 class="logo">TaskFlow Pro</h1>
                <p style="color: var(--text-secondary); margin-top: 0.5rem;">
                    PostgreSQL Integration
                </p>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
            
            <div id="loginError" class="error-message hidden"></div>
            
            <div style="text-align: center; margin-top: 1rem; font-size: 0.875rem; color: var(--text-secondary);">
                Demo: yterayut@gmail.com / test123
            </div>
        </form>
    </div>

    <!-- Main Application -->
    <div id="appContainer" class="hidden">
        <!-- Header -->
        <header class="header">
            <div class="logo">TaskFlow Pro v13.0</div>
            <div class="user-menu">
                <div class="data-source">
                    <i class="fas fa-database"></i>
                    <span id="dataSource">Real ClickUp Data (PostgreSQL)</span>
                </div>
                <div class="user-info">
                    <i class="fas fa-user-circle"></i>
                    <span id="userName">Loading...</span>
                </div>
                <button id="logoutBtn" class="logout-btn">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </header>

        <!-- Main Container -->
        <div class="main-container">
            <!-- Sidebar -->
            <nav class="sidebar">
                <button class="nav-item active" data-view="dashboard">
                    <i class="fas fa-chart-line"></i>
                    Dashboard
                </button>
                <button class="nav-item" data-view="my-tasks">
                    <i class="fas fa-tasks"></i>
                    My Tasks
                </button>
                <button class="nav-item" data-view="team">
                    <i class="fas fa-users"></i>
                    Team Overview
                </button>
                <button class="nav-item" data-view="projects">
                    <i class="fas fa-folder"></i>
                    Projects
                </button>
            </nav>

            <!-- Content -->
            <main class="content">
                <!-- Dashboard View -->
                <div id="dashboardView" class="view">
                    <h2 style="margin-bottom: 2rem;">
                        <i class="fas fa-chart-line"></i>
                        Dashboard Analytics
                    </h2>
                    
                    <div class="stats-grid" id="statsGrid">
                        <!-- Stats will be loaded here -->
                    </div>
                    
                    <div class="card">
                        <h3 style="margin-bottom: 1rem;">
                            <i class="fas fa-info-circle"></i>
                            System Status
                        </h3>
                        <div id="systemStatus">Loading...</div>
                    </div>
                </div>

                <!-- My Tasks View -->
                <div id="myTasksView" class="view hidden">
                    <h2 style="margin-bottom: 2rem;">
                        <i class="fas fa-tasks"></i>
                        My Assigned Tasks
                    </h2>
                    
                    <div id="myTasksList">
                        <!-- Tasks will be loaded here -->
                    </div>
                </div>

                <!-- Team Overview -->
                <div id="teamView" class="view hidden">
                    <h2 style="margin-bottom: 2rem;">
                        <i class="fas fa-users"></i>
                        Team Performance
                    </h2>
                    
                    <div id="teamList">
                        <!-- Team data will be loaded here -->
                    </div>
                </div>

                <!-- Projects View -->
                <div id="projectsView" class="view hidden">
                    <h2 style="margin-bottom: 2rem;">
                        <i class="fas fa-folder"></i>
                        Project Analytics
                    </h2>
                    
                    <div id="projectsList">
                        <!-- Projects will be loaded here -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://192.168.20.10:7812';
        
        let currentUser = null;
        let currentView = 'dashboard';

        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            setupEventListeners();
            checkAuth();
        });

        function setupEventListeners() {
            // Login form
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            
            // Logout button
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);
            
            // Navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const view = e.target.closest('.nav-item').getAttribute('data-view');
                    switchView(view);
                });
            });
        }

        // Authentication
        async function checkAuth() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/v2/dashboard/analytics`, {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    showApp();
                    loadDashboard();
                } else {
                    showLogin();
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                showLogin();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v2/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    currentUser = result.user;
                    showApp();
                    loadDashboard();
                } else {
                    errorDiv.textContent = result.message;
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Login failed. Please try again.';
                errorDiv.classList.remove('hidden');
            }
        }

        async function handleLogout() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/v2/auth/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    currentUser = null;
                    showLogin();
                }
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        // UI Management
        function showLogin() {
            document.getElementById('loginContainer').classList.remove('hidden');
            document.getElementById('appContainer').classList.add('hidden');
        }

        function showApp() {
            document.getElementById('loginContainer').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            
            if (currentUser) {
                document.getElementById('userName').textContent = currentUser.name;
            }
        }

        function switchView(view) {
            // Update navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-view="${view}"]`).classList.add('active');
            
            // Update content
            document.querySelectorAll('.view').forEach(viewElement => {
                viewElement.classList.add('hidden');
            });
            document.getElementById(`${view}View`).classList.remove('hidden');
            
            currentView = view;
            
            // Load view data
            switch(view) {
                case 'dashboard':
                    loadDashboard();
                    break;
                case 'my-tasks':
                    loadMyTasks();
                    break;
                case 'team':
                    loadTeamOverview();
                    break;
                case 'projects':
                    loadProjects();
                    break;
            }
        }

        // Data Loading Functions
        async function loadDashboard() {
            const statsGrid = document.getElementById('statsGrid');
            const systemStatus = document.getElementById('systemStatus');
            
            statsGrid.innerHTML = '<div class="loading"><i class="fas fa-spinner spinner"></i>Loading dashboard...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v2/dashboard/analytics`, {
                    credentials: 'include'
                });
                
                if (!response.ok) throw new Error('Failed to load dashboard');
                
                const result = await response.json();
                const data = result.data;
                
                statsGrid.innerHTML = `
                    <div class="stat-card">
                        <div class="stat-number">${data.totalTasks}</div>
                        <div class="stat-label">Total Tasks</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${data.completedTasks}</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${data.teamMembers}</div>
                        <div class="stat-label">Team Members</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${data.assignments}</div>
                        <div class="stat-label">Assignments</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number">${data.completionRate}%</div>
                        <div class="stat-label">Completion Rate</div>
                    </div>
                `;
                
                systemStatus.innerHTML = `
                    <div style="display: grid; gap: 1rem;">
                        <div><strong>Data Source:</strong> ${data.dataSource}</div>
                        <div><strong>Last Sync:</strong> ${new Date(data.lastSync).toLocaleString()}</div>
                        <div><strong>Backend:</strong> PostgreSQL v13.0.0</div>
                        <div><strong>Status:</strong> <span style="color: var(--success-green);">✅ Production Ready</span></div>
                    </div>
                `;
                
            } catch (error) {
                console.error('Dashboard load error:', error);
                statsGrid.innerHTML = '<div class="error-message">Failed to load dashboard data</div>';
            }
        }

        async function loadMyTasks() {
            const tasksList = document.getElementById('myTasksList');
            tasksList.innerHTML = '<div class="loading"><i class="fas fa-spinner spinner"></i>Loading your tasks...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v2/tasks/my-tasks`, {
                    credentials: 'include'
                });
                
                if (!response.ok) throw new Error('Failed to load tasks');
                
                const result = await response.json();
                
                if (result.tasks.length === 0) {
                    tasksList.innerHTML = '<div class="card"><p>No tasks assigned to you.</p></div>';
                    return;
                }
                
                let tasksHtml = `
                    <div class="data-source">
                        <i class="fas fa-check-circle"></i>
                        ${result.data_source}
                    </div>
                    <p style="margin-bottom: 1rem; color: var(--text-secondary);">
                        ${result.message}
                    </p>
                `;
                
                result.tasks.forEach(task => {
                    const statusClass = getStatusClass(task.status);
                    tasksHtml += `
                        <div class="task-item">
                            <div class="task-title">${task.name}</div>
                            ${task.description ? `<p style="color: var(--text-secondary); margin-bottom: 1rem;">${task.description}</p>` : ''}
                            <div class="task-meta">
                                ${task.status ? `<span class="status-badge ${statusClass}">${task.status}</span>` : ''}
                                ${task.priority ? `<span><i class="fas fa-flag"></i> ${task.priority}</span>` : ''}
                                ${task.due_date ? `<span><i class="fas fa-calendar"></i> ${new Date(parseInt(task.due_date)).toLocaleDateString()}</span>` : ''}
                                ${task.assigned_to ? `<span><i class="fas fa-user"></i> ${task.assigned_to}</span>` : ''}
                            </div>
                        </div>
                    `;
                });
                
                tasksList.innerHTML = tasksHtml;
                
            } catch (error) {
                console.error('My tasks load error:', error);
                tasksList.innerHTML = '<div class="error-message">Failed to load your tasks</div>';
            }
        }

        async function loadTeamOverview() {
            const teamList = document.getElementById('teamList');
            teamList.innerHTML = '<div class="loading"><i class="fas fa-spinner spinner"></i>Loading team data...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v2/team/overview`, {
                    credentials: 'include'
                });
                
                if (!response.ok) throw new Error('Failed to load team data');
                
                const result = await response.json();
                
                let teamHtml = `
                    <div class="data-source">
                        <i class="fas fa-users"></i>
                        ${result.data_source}
                    </div>
                    <div class="stats-grid" style="margin-bottom: 2rem;">
                        <div class="stat-card">
                            <div class="stat-number">${result.totalMembers}</div>
                            <div class="stat-label">Active Members</div>
                        </div>
                    </div>
                `;
                
                result.team.forEach(member => {
                    teamHtml += `
                        <div class="task-item">
                            <div class="task-title">
                                <i class="fas fa-user-circle"></i>
                                ${member.username}
                            </div>
                            <div class="task-meta">
                                ${member.email ? `<span><i class="fas fa-envelope"></i> ${member.email}</span>` : ''}
                                <span><i class="fas fa-tasks"></i> ${member.assigned_tasks} assigned</span>
                                <span><i class="fas fa-check-circle"></i> ${member.completed_tasks} completed</span>
                                ${member.role ? `<span><i class="fas fa-user-tag"></i> Role ${member.role}</span>` : ''}
                            </div>
                        </div>
                    `;
                });
                
                teamList.innerHTML = teamHtml;
                
            } catch (error) {
                console.error('Team overview load error:', error);
                teamList.innerHTML = '<div class="error-message">Failed to load team data</div>';
            }
        }

        async function loadProjects() {
            const projectsList = document.getElementById('projectsList');
            projectsList.innerHTML = '<div class="loading"><i class="fas fa-spinner spinner"></i>Loading projects...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/v2/projects`, {
                    credentials: 'include'
                });
                
                if (!response.ok) throw new Error('Failed to load projects');
                
                const result = await response.json();
                
                let projectsHtml = `
                    <div class="data-source">
                        <i class="fas fa-folder"></i>
                        ${result.data_source}
                    </div>
                    <div class="stats-grid" style="margin-bottom: 2rem;">
                        <div class="stat-card">
                            <div class="stat-number">${result.totalProjects}</div>
                            <div class="stat-label">Active Projects</div>
                        </div>
                    </div>
                `;
                
                result.projects.forEach(project => {
                    const completionRate = project.total_tasks > 0 ? 
                        Math.round((project.completed_tasks / project.total_tasks) * 100) : 0;
                    
                    projectsHtml += `
                        <div class="task-item">
                            <div class="task-title">
                                <i class="fas fa-folder-open"></i>
                                ${project.name}
                            </div>
                            <div class="task-meta">
                                <span><i class="fas fa-tasks"></i> ${project.total_tasks} tasks</span>
                                <span><i class="fas fa-check-circle"></i> ${project.completed_tasks} completed</span>
                                <span><i class="fas fa-clock"></i> ${project.in_progress_tasks} in progress</span>
                                <span><i class="fas fa-percentage"></i> ${completionRate}% done</span>
                                ${project.color ? `<span style="background: ${project.color}; width: 16px; height: 16px; border-radius: 50%; display: inline-block;"></span>` : ''}
                            </div>
                        </div>
                    `;
                });
                
                projectsList.innerHTML = projectsHtml;
                
            } catch (error) {
                console.error('Projects load error:', error);
                projectsList.innerHTML = '<div class="error-message">Failed to load projects</div>';
            }
        }

        // Utility Functions
        function getStatusClass(status) {
            if (!status) return 'status-to-do';
            
            const statusLower = status.toLowerCase();
            if (statusLower.includes('complete') || statusLower.includes('done')) {
                return 'status-complete';
            } else if (statusLower.includes('progress')) {
                return 'status-in-progress';
            } else {
                return 'status-to-do';
            }
        }
    </script>
</body>
</html>
