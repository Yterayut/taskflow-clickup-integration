        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary-blue: #2563eb;
            --primary-blue-dark: #1d4ed8;
            --secondary-blue: #3b82f6;
            --light-blue: #dbeafe;
            --success-green: #10b981;
            --warning-orange: #f59e0b;
            --danger-red: #ef4444;
            --text-dark: #1f2937;
            --text-gray: #6b7280;
            --text-light: #9ca3af;
            --bg-white: #ffffff;
            --bg-gray: #f9fafb;
            --bg-light: #f3f4f6;
            --border-gray: #e5e7eb;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-gray);
            color: var(--text-dark);
            line-height: 1.6;
        }
        
        /* Login Page Styles */
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
        }
        
        .login-card {
            background: var(--bg-white);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        
        .login-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--primary-blue);
        }
        
        .login-subtitle {
            color: var(--text-gray);
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .form-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-gray);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .login-btn {
            width: 100%;
            padding: 1rem;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .login-btn:hover {
            background: var(--primary-blue-dark);
            transform: translateY(-1px);
        }
        
        /* Header Styles */
        .header {
            background: var(--bg-white);
            border-bottom: 1px solid var(--border-gray);
            height: 80px;
            display: flex;
            align-items: center;
            padding: 0 2rem;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        
        .header-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-blue);
        }
        
        .nav-menu {
            display: flex;
            gap: 1rem;
        }
        
        .nav-item {
            padding: 0.7rem 1.5rem;
            background: none;
            border: none;
            color: var(--text-gray);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .nav-item:hover, .nav-item.active {
            background: var(--primary-blue);
            color: white;
            transform: translateY(-1px);
        }
        
        .header-right {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .user-profile {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 1rem;
            background: var(--bg-light);
            border-radius: 12px;
        }
        
        .logout-btn {
            padding: 0.6rem 1.2rem;
            background: var(--danger-red);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .logout-btn:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }
        
        /* Main Content Styles */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1400px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .page-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--text-dark);
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }
        
        .card {
            background: var(--bg-white);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .kpi-card {
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--primary-blue);
        }
        
        .kpi-value {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--primary-blue);
        }
        
        .kpi-label {
            color: var(--text-gray);
            font-size: 1rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .kpi-trend {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .trend-up { color: var(--success-green); }
        .trend-down { color: var(--danger-red); }
        
        /* Task Management Styles */
        .task-section {
            background: var(--bg-white);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }
        
        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-dark);
        }
        
        .task-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .filter-label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-gray);
        }
        
        .filter-select, .filter-input {
            padding: 0.7rem;
            border: 2px solid var(--border-gray);
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.3s ease;
        }
        
        .filter-select:focus, .filter-input:focus {
            outline: none;
            border-color: var(--primary-blue);
        }
        
        .task-list {
            display: grid;
            gap: 1rem;
        }
        
        .task-item {
            background: var(--bg-light);
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .task-item:hover {
            background: var(--bg-white);
            box-shadow: var(--shadow-md);
        }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        
        .task-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .task-priority {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .priority-high {
            background: #fee2e2;
            color: var(--danger-red);
        }
        
        .priority-medium {
            background: #fef3c7;
            color: var(--warning-orange);
        }
        
        .priority-low {
            background: #d1fae5;
            color: var(--success-green);
        }
        
        .task-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.9rem;
            color: var(--text-gray);
        }
        
        .task-status {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .status-completed {
            background: #d1fae5;
            color: var(--success-green);
        }
        
        .status-in-progress {
            background: #dbeafe;
            color: var(--primary-blue);
        }
        
        .status-pending {
            background: #fef3c7;
            color: var(--warning-orange);
        }
        
        /* Attendance Reporting Styles */
        .attendance-section {
            margin-top: 2rem;
        }
        
        .date-range-picker {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            align-items: end;
        }
        
        .btn-primary {
            padding: 0.7rem 1.5rem;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: var(--primary-blue-dark);
            transform: translateY(-1px);
        }
        
        .attendance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .attendance-card {
            background: var(--bg-white);
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }
        
        .attendance-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .attendance-status {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        .status-present { background: #d1fae5; color: var(--success-green); }
        .status-sick { background: #fef3c7; color: var(--warning-orange); }
        .status-annual { background: #dbeafe; color: var(--primary-blue); }
        .status-absent { background: #fee2e2; color: var(--danger-red); }
        
        .attendance-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1.5rem;
        }
        
        .summary-item {
            background: var(--bg-light);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }
        
        .summary-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-blue);
        }
        
        .summary-label {
            font-size: 0.9rem;
            color: var(--text-gray);
            font-weight: 600;
        }
        
        /* Team Ranking Styles */
        .ranking-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .ranking-list {
            display: grid;
            gap: 1rem;
        }
        
        .ranking-item {
            display: flex;
            align-items: center;
            background: var(--bg-white);
            border: 1px solid var(--border-gray);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .ranking-item:hover {
            box-shadow: var(--shadow-md);
        }
        
        .ranking-position {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-blue);
            margin-right: 1rem;
            min-width: 3rem;
            text-align: center;
        }
        
        .ranking-info {
            flex: 1;
        }
        
        .ranking-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
        }
        
        .ranking-email {
            font-size: 0.9rem;
            color: var(--text-gray);
        }
        
        .ranking-score {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--success-green);
            text-align: right;
        }
        
        /* Settings Styles */
        .settings-section {
            margin-bottom: 2rem;
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-gray);
        }
        
        .setting-label {
            font-weight: 600;
        }
        
        .setting-description {
            font-size: 0.9rem;
            color: var(--text-gray);
        }
        
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 25px;
            background: var(--border-gray);
            border-radius: 15px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .toggle-switch.active {
            background: var(--primary-blue);
        }
        
        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 21px;
            height: 21px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s ease;
        }
        
        .toggle-switch.active .toggle-slider {
            transform: translateX(25px);
        }

        /* Settings Tabs Styles */
        .settings-tabs {
            display: flex;
            gap: 0.5rem;
            border-bottom: 2px solid var(--border-gray);
            padding-bottom: 0;
        }

        .tab-button {
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-gray);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tab-button:hover {
            color: var(--primary-blue);
            background: var(--light-blue);
        }

        .tab-button.active {
            color: var(--primary-blue);
            border-bottom-color: var(--primary-blue);
            background: var(--light-blue);
        }

        .tab-button i {
            font-size: 0.9rem;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header {
                padding: 0 1rem;
            }
            
            .header-left {
                gap: 1rem;
            }
            
            .nav-menu {
                display: none;
            }
            
            .main-content {
                padding: 1rem;
            }
            
            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .task-controls {
                flex-direction: column;
            }
            
            .task-header {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
        
        /* Loading States */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            color: var(--text-gray);
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-gray);
            border-top: 4px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

        // Configurable Scoring Settings
        const defaultScoringConfig = {
            completedTaskWeight: 10,
            highPriorityWeight: 5,
            onTimeCompletionWeight: 15,
            teamworkWeight: 5,
            qualityWeight: 8
        };

        // Get scoring config from localStorage or use default
        const getScoringConfig = () => {
            const saved = localStorage.getItem('scoringConfig');
            return saved ? JSON.parse(saved) : defaultScoringConfig;
        };

        // Save scoring config to localStorage
        const saveScoringConfig = (config) => {
            localStorage.setItem('scoringConfig', JSON.stringify(config));
        };

        // Enhanced Team Ranking Algorithm with Configurable Scoring
        const calculateTeamRanking = (users, tasks) => {
            const config = getScoringConfig();
            
            return users.map(user => {
                const userTasks = tasks.filter(task => task.assignee === user.name);
                const completedTasks = userTasks.filter(task => task.status === 'completed').length;
                const highPriorityTasks = userTasks.filter(task => task.priority === 'high').length;
                const onTimeCompletion = userTasks.filter(task => 
                    task.status === 'completed' && new Date(task.dueDate) >= new Date()
                ).length;
                
                // Additional metrics for enhanced scoring
                const teamworkScore = Math.floor(Math.random() * 10) + 1; // Mock teamwork score
                const qualityScore = Math.floor(Math.random() * 10) + 1; // Mock quality score
                
                const score = (completedTasks * config.completedTaskWeight) + 
                             (highPriorityTasks * config.highPriorityWeight) + 
                             (onTimeCompletion * config.onTimeCompletionWeight) +
                             (teamworkScore * config.teamworkWeight) +
                             (qualityScore * config.qualityWeight);
                
                return {
                    ...user,
                    score: Math.round(score),
                    completedTasks: completedTasks,
                    totalTasks: userTasks.length,
                    teamworkScore: teamworkScore,
                    qualityScore: qualityScore,
                    onTimeRate: userTasks.length > 0 ? Math.round((onTimeCompletion / userTasks.length) * 100) : 0
                };
            }).sort((a, b) => b.score - a.score);
        };

        // Main App Component
        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [currentUser, setCurrentUser] = useState(null);
            const [currentView, setCurrentView] = useState('dashboard');
            const [tasks, setTasks] = useState([]);

            useEffect(() => {
                // Load mock tasks
                setTasks(generateMockTasks());
                
                // Check if user is already logged in
                const savedUser = localStorage.getItem('currentUser');
                const authToken = localStorage.getItem('authToken');
                if (savedUser && authToken) {
                    setCurrentUser(JSON.parse(savedUser));
                    setIsAuthenticated(true);
                }
            }, []);

            const handleLogin = (email, password) => {
                const user = userDatabase[email];
                if (user && user.password === password) {
                    setCurrentUser(user);
                    setIsAuthenticated(true);
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    localStorage.setItem('authToken', 'demo_token_' + Date.now());
                } else {
                    alert('อีเมลหรือรหัสผ่านไม่ถูกต้อง');
                }
            };

            const handleLogout = () => {
                setIsAuthenticated(false);
                setCurrentUser(null);
                setCurrentView('dashboard');
                localStorage.removeItem('currentUser');
                localStorage.removeItem('authToken');
            };

            const renderContent = () => {
                switch (currentView) {
                    case 'dashboard':
                        return React.createElement(Dashboard, { tasks });
                    case 'tasks':
                        return React.createElement(MyTasks, { tasks, user: currentUser });
                    case 'employees':
                        return React.createElement(EmployeeManagement);
                    case 'reports':
                        return React.createElement(Reports);
                    case 'ranking':
                        return React.createElement(TeamRanking, { tasks });
                    case 'settings':
                        return React.createElement(Settings);
                    default:
                        return React.createElement(Dashboard, { tasks });
                }
            };

            if (!isAuthenticated) {
                return React.createElement(LoginPage, { onLogin: handleLogin });
            }

            return (
                <div>
                    {React.createElement(Header, {
                        user: currentUser,
                        currentView: currentView,
                        setCurrentView: setCurrentView,
                        onLogout: handleLogout
                    })}
                    {renderContent()}
                </div>
            );
        }

        // Render the app
        ReactDOM.render(React.createElement(App), document.getElementById('root'));
    </script>
